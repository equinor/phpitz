apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: phpitz
spec:
  environments:
    - name: dev
      build:
        from: main
  components:
    - name: backend
      ports:
        - name: http
          port: 8008
      publicPort: http
      authentication:
        oauth2:
          clientId: a4f4519a-fafb-48c2-9a5c-3ba38309a824
          sessionStoreType: systemManaged
        environmentConfig:
          - environment: dev
            authentication:
              oauth2:
                scope: openid profile email offline_access api://a4f4519a-fafb-48c2-9a5c-3ba38309a824/co2specdemo.user
          